<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Harcama Ekle - Bütçe Takip</title>
  <link rel="stylesheet" href="css/stil.css">
</head>
<body>
  <header>
    <img src="img/logo.svg" alt="Bütçe Takip logosu" width="64">
    <h1>Bütçe Takip Uygulaması</h1>
    <nav>
      <ul>
        <li><a href="index.html">Ana Sayfa</a></li>
        <li><a href="harcamalar.html">Harcamalarım</a></li>
        <li><a href="harcama-ekle.html" class="aktif">Harcama Ekle</a></li>
        <li><a href="hakkinda.html">Hakkında</a></li>
      </ul>
    </nav>
  </header>

  <main>
    <h2>Harcama Ekle</h2>
    <form id="harcamaFormu" method="get">
      <p>
        <label for="aciklama">Açıklama</label><br>
        <input type="text" id="aciklama" name="aciklama" placeholder="Örn. Market alışverişi" required>
      </p>
      <p>
        <label for="tutar">Tutar (TL)</label><br>
        <input type="number" id="tutar" name="tutar" min="0" max="100000" step="1" required>
      </p>
      <p>
        <label for="kategori">Kategori</label><br>
        <select id="kategori" name="kategori" required>
          <option value="">Seçiniz</option>
          <option value="gida">Gıda</option>
          <option value="ulasim">Ulaşım</option>
          <option value="fatura">Fatura</option>
          <option value="egitim">Eğitim</option>
          <option value="diger">Diğer</option>
        </select>
      </p>
      <p>
        <label for="tarih">Tarih</label><br>
        <input type="date" id="tarih" name="tarih" required>
      </p>
      <p>
        Ödeme tipi:
        <input type="radio" id="nakit" name="odeme" value="nakit" checked>
        <label for="nakit">Nakit</label>
        <input type="radio" id="kart" name="odeme" value="kart">
        <label for="kart">Kart</label>
      </p>
      <p>
        <label for="not">Not</label><br>
        <textarea id="not" name="not" rows="3" cols="40"></textarea>
      </p>
      <button type="submit">Kaydet</button>
    </form>
  </main>

  <footer>
    <p>&copy; 2026 Bütçe Takip &middot; BLM2537</p>
  </footer>
</body>
</html>
