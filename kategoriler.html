  <main>
    <h1>Kategoriler</h1>

    <section class="kutu">
      <h2>Hazır kategoriler</h2>
      <ul>
        <li>Gıda</li>
        <li>Ulaşım</li>
        <li>Fatura</li>
        <li>Eğitim</li>
        <li>Eğlence</li>
        <li>Kira</li>
        <li>Burs</li>
      </ul>
    </section>

    <section class="kutu">
      <h2>Yeni kategori</h2>
      <form method="get">
        <p>
          <label for="ad">Ad</label>
          <input type="text" id="ad" name="ad" required>
        </p>
        <p>
          <label for="tur">Tür</label>
          <select id="tur" name="tur">
            <option value="gider">Gider</option>
            <option value="gelir">Gelir</option>
          </select>
        </p>
        <button type="submit">Ekle</button>
      </form>
    </section>
  </main>
